# === GENERAL SETTINGS (SIGMA CONFIG ZONE) ===

# Cooldown between kit claims (in mewing minutes)
# 5 = Take 5 minutes mewing break between kits
# 0 = Unlimited mogging potential (based)
# 1440 = Touch grass for 24 hours (beta behavior)
cooldown: 5

# Deprecated: Now use slot value. 1.2 will have this removed
weight: 0

slot: 13

# GUI title when previewing this absolute unit of a kit
# Leave empty to let the kit's raw aura speak for itself
guiTitle: ''

# === GUI DISPLAY (MOGGING MENU PRESENCE) ===
# How your kit flexes in the main menu
display:
  # When player has big jawline energy (permission + no cooldown)
  access:
    name: ''                    # The drip name (use & for colors, be creative or stay beta)
    amount: 1                   # Stack size (visual flex only)
    lore: []                    # Your kit's rizz description
    enchants: []                # Make it glow like your aura ('sharpness:5')
    flags: []                   # Hide the cringe ('HIDE_ATTRIBUTES')
    material: STONE            # Icon material (DIAMOND_BLOCK for chads)

  # When player has negative canthal tilt (no permission)
  denied:
    name: ''                    # Usually something like '&cNOT HIM'
    amount: 1
    lore: []                    # Explain why they're not mogging yet
    enchants: []
    flags: []
    material: STONE            # BARRIER is peak beta energy

  # Currently in mewing recovery period (cooldown active)
  cooldown:
    name: ''                    # '&eMewing in progress: %kit_[kit name]_cooldown%'
    amount: 1
    lore: []                    # "it's a marathon, not a sprint" - looksmax.org user
    enchants: []
    flags: []
    material: STONE            # CLOCK to track the mew


# === STATUS ICON (THE BUTTON IN PREVIEW) ===
# Shows kit status in kit preview GUI (not main menu) with one-click claiming
# This is the clickable button players use to claim the kit from preview
statusIcon:
  enabled: true                 # true = show status icon, false = no claim button in preview
  slot: 51                      # Slot position in preview GUI (0-53 for 6-row inventory)
  modify_type: OVERRIDE_PARTS   # How status variants modify the base icon:
                                # OVERRIDE_PARTS - only non-empty fields override (name, lore, etc.)
                                # OVERRIDE_WHOLE - completely replaces with the variant item
                                # NONE - no visual changes, but button still works

  # Default materials: GREEN_DYE (access), RED_DYE (denied), YELLOW_DYE (cooldown)
  # Leave fields empty/default to use built-in defaults
  access:
    name: ''                    # Override display name when kit is available
    amount: 1                   # Stack size (use -1 to not override)
    lore: []                    # Override lore lines
    enchants: []                # Add enchant glow
    flags: []                   # Item flags
    material: ''                # Override material (empty = GREEN_DYE default)
  denied:
    name: ''                    # Override display name when no permission
    amount: -1                  # -1 = don't override amount
    lore: []
    enchants: []
    flags: []
    material: ''                # Empty = RED_DYE default
  cooldown:
    name: ''                    # Override display name during cooldown
    amount: -1
    lore: []
    enchants: []
    flags: []
    material: ''                # Empty = YELLOW_DYE default

# === DENIED CLICK BEHAVIOR (REDIRECT THE BETAS) ===
# What happens when someone LMB clicks a kit they can't access
# Perfect for redirecting them to your store or just roasting them
lmb_denied_behavior:
  enabled: false                # true = actions fire on denied LMB click
  actions:                      # List of actions to execute
  # - '/store'                # Starts with / = runs as player command
  # - '&cNice try beta, buy VIP at store.example.com'  # No / = sends message also links are clickable
  # Pro tip: Combine message + command for maximum monetization
  # Future: This might get more advanced (sound effects, titles, etc.)


# === ARMOR (THE DRIP CONFIGURATION) ===
armor:
  # true = instant drip application (equips automatically, replaces current armor)
  # false = manual drip management (armor goes to inventory like regular items)
  # Full inventory behavior controlled by config.yml dropWhenFull
  autoEquip: true                 # Default: true

  # Pro tip: Set material to null to skip (naked mewing technique)
  helmet:
    name: ''                    # Crown your dome with glory
    amount: 1                   # Always 1 (you only have one head, beta)
    lore: []                    # Describe your cranial supremacy
    enchants: []                # 'protection:4' to protect the mew
    flags: []                   # HIDE_ATTRIBUTES to hide your power level
    material: STONE            # null for bald supremacy, DIAMOND_HELMET for kings

  chestplate:
    name: ''                    # Pectoral fortress of power
    amount: 1
    lore: []                    # Chest expansion lore
    enchants: []                # Bench press enchants
    flags: []
    material: STONE            # NETHERITE_CHESTPLATE for maximum mogging

  leggings:
    name: ''                    # Leg day proof
    amount: 1
    lore: []                    # Proof you didn't skip leg day
    enchants: []                # 'swift_sneak:3' for that grindset speed
    flags: []
    material: STONE            # GOLDEN_LEGGINGS if you're zesty

  boots:
    name: ''                    # The grind steppers
    amount: 1
    lore: []                    # Every step towards success
    enchants: []                # 'soul_speed:3' to outrun the haters
    flags: []
    material: STONE            # DIAMOND_BOOTS or stay barefoot maxxing

# === ITEMS (INVENTORY MOGGING LOADOUT) ===
