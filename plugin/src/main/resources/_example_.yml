# Format: MATERIAL_NAME as key (use all caps or get mogged)
# Empty kit? Use 'items: []' or 'items: {}' for the fasting arc
items:
  # Starter example (replace STONE with actual chad materials)
  STONE:                        # The material (DIAMOND_SWORD for alphas)
    name: ''                    # Item's rizz name (use & colors)
    amount: 1                   # Stack size (64 for maximum flex)
    lore: []                    # Item's backstory and power level
    enchants: []                # Juice it up ('sharpness:5', 'unbreaking:3')
    flags: []                   # Hide the normie stats ('HIDE_ATTRIBUTES')

